name: Game checks
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: game-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Game checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Detect the main merge queue
        id: queue
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if queue=$(gh api "repos/$GH_REPO/rules/branches/main" --paginate --jq '.[] | select(.type == "merge_queue") | .type'); then
            if [[ -n "$queue" ]]; then
              echo 'active=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::Could not confirm an active merge queue. Running the full suite."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Install pinned Bun
        run: bash scripts/install-bun.sh
      - name: Restore exact dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Match the seed paths without archiving Vite's generated directories.
          path: |
            node_modules/*
            !node_modules/.vite
            !node_modules/.vite-temp
          key: node-modules-ubuntu26-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock', 'bunfig.toml', 'scripts/install-bun.sh') }}
      - name: Record dependency cache result
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: |
          echo "Exact node_modules cache hit: ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - name: Run game checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          QUEUE_ACTIVE: ${{ steps.queue.outputs.active }}
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: |
          mode=full
          if [[ "$QUEUE_ACTIVE" == true ]]; then
            mode=selected
          fi
          install_options=()
          if [[ "$CACHE_HIT" != true ]]; then
            install_options+=(--install-dependencies)
          fi
          bun scripts/verify.ts "$mode" "$BASE_SHA" "$HEAD_SHA" "${install_options[@]}" --install-chromium --check-committed
      - name: Seed dependencies from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/*
            !node_modules/.vite
            !node_modules/.vite-temp
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
