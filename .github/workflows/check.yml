name: Game checks
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: game-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Game checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Detect the main merge queue
        id: queue
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if queue=$(gh api "repos/$GH_REPO/rules/branches/main" --paginate --jq '.[] | select(.type == "merge_queue") | .type'); then
            if [[ -n "$queue" ]]; then
              echo 'active=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::Could not confirm an active merge queue. Running the full suite."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Run game checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          QUEUE_ACTIVE: ${{ steps.queue.outputs.active }}
        run: |
          mode=full
          if [[ "$QUEUE_ACTIVE" == true ]]; then
            mode=selected
          fi
          node scripts/verify.ts "$mode" "$BASE_SHA" "$HEAD_SHA" --install-chromium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
