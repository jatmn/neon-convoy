name: Game checks
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read

concurrency:
  group: game-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Game checks
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Start job timing lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          clock="$RUNNER_TEMP/game-check-start"
          (
            set -euo pipefail
            started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | select(.name == "Game checks") | .started_at')
            test -n "$started"
            date -u -d "$started" +%s%3N > "$clock.partial"
            mv "$clock.partial" "$clock"
          ) </dev/null >"$clock.log" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit already has its exact base as a parent.
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - name: Install pinned Bun
        run: bash scripts/install-bun.sh
      - name: Select affected surfaces
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Narrow PR feedback only when an active queue will run the full suite.
          mode=full
          if [[ "$EVENT_NAME" == pull_request && "$BASE_REF" == main ]]; then
            if queue=$(gh api "repos/$GH_REPO/rules/branches/main" --jq 'any(.[]; .type == "merge_queue")'); then
              [[ "$queue" != true ]] || mode=selected
            else
              echo "::warning::Could not confirm an active merge queue. Running the full suite."
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Restore exact dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            !node_modules/.vite/**
            !node_modules/.vite-temp/**
          key: node-modules-v2-ubuntu26-${{ runner.arch }}-${{ hashFiles('bun.lock', 'scripts/install-bun.sh') }}
      - name: Restore cached Bun packages
        id: packages
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/neon-bun-cache
          key: bun-packages-ubuntu26-${{ runner.arch }}-${{ hashFiles('scripts/install-bun.sh') }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-packages-ubuntu26-${{ runner.arch }}-${{ hashFiles('scripts/install-bun.sh') }}-
      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/neon-bun-cache
        run: bun install --frozen-lockfile
      - name: Record dependency cache result
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
          PACKAGES_KEY: ${{ steps.packages.outputs.cache-matched-key }}
        run: |
          echo "Exact node_modules cache hit: ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "Restored Bun package cache: ${PACKAGES_KEY:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Run game checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          MODE: ${{ steps.paths.outputs.mode }}
        run: |
          clock="$RUNNER_TEMP/game-check-start"
          if ! read -r GAME_CHECK_STARTED_MS < "$clock"; then
            cat "$clock.log"
            echo "::error::GitHub job start time is unavailable."
            exit 1
          fi
          export GAME_CHECK_STARTED_MS
          # Reserve two seconds of the 35 s job budget for runner finalization.
          remaining=$(( 33000 - ($(date +%s%3N) - GAME_CHECK_STARTED_MS) ))
          if (( remaining <= 0 )); then
            echo "::error::Setup exhausted the required job budget."
            exit 1
          fi
          printf -v deadline '%d.%03ds' "$((remaining / 1000))" "$((remaining % 1000))"
          timeout --kill-after=1s "$deadline" bun scripts/verify.ts "$MODE" "$BASE_SHA" "$HEAD_SHA" --install-chromium
      - name: Seed dependencies from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            !node_modules/.vite/**
            !node_modules/.vite-temp/**
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Seed Bun packages from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dependencies.outputs.cache-hit != 'true' && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/neon-bun-cache
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - name: Record full-suite file timings
        if: always() && !cancelled() && steps.paths.outputs.mode == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-file-timings
          path: test-results/timings/
          retention-days: 14
      - name: Enforce elapsed job budget
        if: always()
        run: |
          read -r GAME_CHECK_STARTED_MS < "$RUNNER_TEMP/game-check-start"
          elapsed=$(( $(date +%s%3N) - GAME_CHECK_STARTED_MS ))
          echo "Game checks runner elapsed: ${elapsed} ms (33 s plus finalization)" >> "$GITHUB_STEP_SUMMARY"
          if (( elapsed >= 33000 )); then
            echo "::error::Game checks exceeded the 35 s job budget."
            exit 1
          fi
