name: Game checks
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read

concurrency:
  group: game-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Game checks
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Start job timing lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          clock="$RUNNER_TEMP/game-check-start"
          echo "$(( $(date +%s%3N) + 15000 ))" > "$clock.wait-until"
          (
            set -euo pipefail
            if timeout --kill-after=1s 14s bash -c '
              # Keep each request in the outer watchdog process group.
              until started=$(timeout --foreground --kill-after=1s 3s gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq "$1") &&
                [[ -n "$started" ]] && date -u -d "$started" +%s%3N; do
                sleep 0.25
              done
            ' _ '.jobs[] | select(.name == "Game checks") | .started_at' > "$clock.partial"; then
              mv "$clock.partial" "$clock"
            else
              echo "Could not read the job start time from GitHub."
              touch "$clock.failed"
            fi
          ) </dev/null >"$clock.log" 2>&1 &
      - name: Detect the main merge queue
        id: queue
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if queue=$(timeout --kill-after=1s 3s gh api "repos/$GH_REPO/rules/branches/main" --paginate --jq '.[] | select(.type == "merge_queue") | .type'); then
            if [[ -n "$queue" ]]; then
              echo 'active=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::Could not confirm an active merge queue. Running the full suite."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          # The PR merge commit already has its exact base as a parent.
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - name: Run game checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          QUEUE_ACTIVE: ${{ steps.queue.outputs.active }}
        run: |
          mode=full
          if [[ "$QUEUE_ACTIVE" == true ]]; then
            mode=selected
          fi
          clock="$RUNNER_TEMP/game-check-start"
          if [[ ! -f "$clock" ]] && read -r wait_until < "$clock.wait-until"; then
            while [[ ! -f "$clock" && ! -f "$clock.failed" ]] && (( $(date +%s%3N) < wait_until )); do
              sleep 0.1
            done
          fi
          if [[ ! -f "$clock" ]] || ! read -r GAME_CHECK_STARTED_MS < "$clock"; then
            if [[ -s "$clock.log" ]]; then cat "$clock.log"; fi
            echo "::error::GitHub job start time is unavailable."
            exit 1
          fi
          export GAME_CHECK_STARTED_MS
          setup_deadline=$(( GAME_CHECK_STARTED_MS + 15000 ))
          setup_overrun() {
            echo "::error::Setup budget: failed before verification (15000 ms limit)."
          }
          remaining=$(( setup_deadline - $(date +%s%3N) ))
          if (( remaining <= 0 )); then
            setup_overrun
            exit 1
          fi
          printf -v deadline '%d.%03ds' "$((remaining / 1000))" "$((remaining % 1000))"
          if timeout --kill-after=1s "$deadline" bash scripts/install-bun.sh; then
            export PATH="$RUNNER_TEMP/neon-bun:$PATH"
          else
            status=$?
            if (( status == 124 || status == 137 || $(date +%s%3N) >= setup_deadline )); then
              setup_overrun
            fi
            exit "$status"
          fi
          export GAME_CHECK_DEADLINE_MS=$(( GAME_CHECK_STARTED_MS + 33000 ))
          remaining=$(( GAME_CHECK_DEADLINE_MS - $(date +%s%3N) ))
          if (( remaining <= 0 )); then
            echo "::error::Game checks reached the 33 s validation cutoff."
            exit 1
          fi
          printf -v deadline '%d.%03ds' "$((remaining / 1000))" "$((remaining % 1000))"
          timeout --kill-after=1s "$deadline" bun scripts/verify.ts "$mode" "$BASE_SHA" "$HEAD_SHA" --install-dependencies --install-chromium --check-committed
      - name: Enforce elapsed validation budget
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          clock="$RUNNER_TEMP/game-check-start"
          if [[ ! -f "$clock" ]]; then exit 0; fi
          read -r GAME_CHECK_STARTED_MS < "$clock"
          elapsed=$(( $(date +%s%3N) - GAME_CHECK_STARTED_MS ))
          echo "Game checks runner elapsed before artifact handling: ${elapsed} ms (33000 ms validation cutoff)" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CHECKOUT_OUTCOME" == failure ]] && (( elapsed >= 15000 )); then
            echo "::error::Setup budget: checkout failed after the 15000 ms limit."
            exit 1
          fi
          if (( elapsed >= 33000 )); then
            echo "::error::Game checks reached the 33 s validation cutoff."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - name: Record full-suite file timings
        if: success() && hashFiles('test-results/timings/files.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-file-timings
          path: test-results/timings/
          retention-days: 14
