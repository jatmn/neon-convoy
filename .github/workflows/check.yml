name: Game checks
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: game-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      types: ${{ steps.paths.outputs.types }}
      simulation: ${{ steps.paths.outputs.simulation }}
      browser: ${{ steps.paths.outputs.browser }}
      distribution: ${{ steps.paths.outputs.distribution }}
      deployment: ${{ steps.paths.outputs.deployment }}
      uploader_result: ${{ steps.uploader.outcome }}
    steps:
      - name: Detect the main merge queue
        id: queue
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if queue=$(gh api "repos/$GH_REPO/rules/branches/main" --paginate --jq '.[] | select(.type == "merge_queue") | .type'); then
            if [[ -n "$queue" ]]; then
              echo 'active=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::Could not confirm an active merge queue. Running the full suite."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Select checks to run
        id: paths
        env:
          QUEUE_ACTIVE: ${{ steps.queue.outputs.active }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$QUEUE_ACTIVE" == true ]]; then
            node scripts/ci.ts "$BASE_SHA" "$HEAD_SHA"
          else
            printf '%s=true\n' types simulation browser distribution deployment >> "$GITHUB_OUTPUT"
          fi
      - name: Test CI routing (no dependencies required)
        run: node --test tests/ci.test.ts
      - name: Test owner-command authorization (no dependencies required)
        run: node --test scripts/pullfrog-command-check.test.ts
      - name: Test uploader (no dependencies required)
        id: uploader
        if: steps.paths.outputs.deployment == 'true'
        run: node --test tests/deploy.test.ts

  types:
    name: TypeScript
    needs: changes
    if: needs.changes.outputs.types == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  simulation:
    name: Simulation
    needs: changes
    if: needs.changes.outputs.simulation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - run: node --test tests/engine.test.ts

  browser:
    name: Browser controls
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      # Both projects use Playwright's default Chromium headless shell.
      - name: Install pinned Chromium headless shell
        run: npx --no-install playwright install --only-shell chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  distribution:
    name: Production and standalone
    needs: changes
    if: needs.changes.outputs.distribution == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check committed standalone build
        run: git show HEAD:play.html | cmp - play.html
      # Both projects use Playwright's default Chromium headless shell.
      - name: Install pinned Chromium headless shell
        run: npx --no-install playwright install --only-shell chromium
      - run: npm run test:distribution
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: distribution-test-results
          path: test-results/
          retention-days: 7

  checks:
    # Require this stable check in branch protection, not conditional jobs.
    name: Game checks
    needs: [changes, types, simulation, browser, distribution]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify selected checks succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          errors = []
          if results['changes']['result'] != 'success':
              errors.append('Check selection or tooling tests failed')
          outputs = results['changes']['outputs']
          outcomes = {job: results[job]['result'] for job in ('types', 'simulation', 'browser', 'distribution')}
          outcomes['deployment'] = outputs.get('uploader_result')
          for job, outcome in outcomes.items():
              selected = outputs.get(job)
              if selected not in ('true', 'false'):
                  errors.append(f'{job}: missing or invalid selection')
              elif outcome != ('success' if selected == 'true' else 'skipped'):
                  errors.append(f'{job}: {outcome}')
          for message in errors:
              print(f'::error::{message}', flush=True)
          raise SystemExit(bool(errors))
          PY
