name: Deploy live preview

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'favicon.svg'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'scripts/standalone.ts'
      - 'scripts/deploy.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Never cancel an upload midway or allow concurrent writes to the same site.
concurrency:
  group: bunny-live-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: bunny-production
      url: https://neon-convoy.jatmn.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A queued/manual run must not restore an older main snapshot.
          ref: main
          persist-credentials: false
      - name: Wait for successful main CI on the deployed revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          revision=$(git rev-parse HEAD)
          for attempt in {1..60}; do
            result=$(gh api "repos/$GH_REPO/actions/workflows/check.yml/runs?event=push&branch=main&head_sha=$revision&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "waiting" elif .status != "completed" then "waiting" else .conclusion end')
            case "$result" in
              success) exit 0 ;;
              waiting) sleep 10 ;;
              *) echo "Main CI did not succeed for $revision: $result" >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for main CI on $revision" >&2
          exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check committed standalone build
        run: git show HEAD:play.html | cmp - play.html
      - name: Upload production files
        env:
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_HOST: ${{ vars.BUNNY_STORAGE_HOST }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: node scripts/deploy.ts
      - name: Record deployed revision
        run: |
          revision=$(git rev-parse HEAD)
          echo "Published commit: $revision" >> "$GITHUB_STEP_SUMMARY"
          echo "Play: https://neon-convoy.jatmn.dev" >> "$GITHUB_STEP_SUMMARY"
